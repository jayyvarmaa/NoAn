<!DOCTYPE html>
<html>
<head>
    <title>Extension</title>
    <meta charset="UTF-8">
    <!-- Allow zooming but prevent automatic zooming -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=10.0, minimum-scale=1.0, user-scalable=yes">
    <!-- Prevent text size adjustment on mobile devices -->
    <meta name="format-detection" content="telephone=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&display=swap" rel="stylesheet">
    <style>
        /* Allow scrolling but prevent automatic scrolling */
        html, body {
            overflow: hidden;
            touch-action: manipulation; /* Allow pinch zoom but prevent other touch actions */
            -ms-touch-action: manipulation;
            margin: 0;
            font-family: 'League Spartan', sans-serif;
            /* Set fixed dimensions to prevent resizing */
            width: 100vw;
            height: 100vh;
            background-color: black; /* Default black background */
        }
        
        /* Container for all content to maintain fixed positioning */
        .container {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
            -ms-touch-action: manipulation;
        }
        
        /* Background image container */
        .background-container {
            position: relative;
            width: 100%;
            height: 100%;
            font-size: 0; /* Remove whitespace */
        }
        
        /* Background image - maintain aspect ratio without cutting */
        .background-image {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Changed to contain to prevent cutting */
            object-position: center; /* Center the image */
        }
        
        .button-container {
            position: absolute;
            top: 48.5%; /* Desktop position */
            left: 42%; /* Desktop position */
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        
        .download-button {
            background-color: rgba(0, 0, 0, 0.7);
            color: red;
            padding: 0.3vw 0.6vw; /* Further reduced responsive padding */
            font-size: 1.1vw; /* Further reduced responsive font size */
            border: 0.075vw solid red; /* Further reduced responsive border */
            border-radius: 1vw; /* Further reduced responsive border radius */
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            white-space: nowrap; /* Prevent text wrapping */
        }
        
        .download-button:hover {
            background-color: rgba(255, 255, 255, 0.027);
            transform: scale(1.05);
        }
        
        .credit {
            color: white;
            font-size: 0.75vw; /* Further reduced responsive font size */
            background-color: rgba(0, 0, 0, 0.5);
            padding: 0.3vw 0.6vw; /* Further reduced responsive padding */
            border-radius: 0.6vw; /* Further reduced responsive border radius */
            margin-top: 1vw; /* Space between button and credit */
            white-space: nowrap; /* Prevent text wrapping */
        }
        
        .credit a {
            color: white;
            text-decoration: none;
        }
        
        .credit a:hover {
            color: red;
        }
        
        /* Prevent right-click context menu */
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Mobile styles */
        @media screen and (max-width: 768px) {
            .button-container {
                top: 49.7%; /* Mobile position */
                left: 42%; /* Mobile position */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="background-container">
            <img src="website.jpg" alt="Background" class="background-image">
            
            <div class="button-container">
                <a href="Remove_Icons_YT.rar" download class="download-button">download NoAn</a>
                <div class="credit">Created by <a href="https://www.instagram.com/jayyvarmaa/" target="_blank">@jayyvarmaa</a></div>
            </div>
        </div>
    </div>
    
    <script>
        // Allow pinch zoom on touch devices
        document.addEventListener('touchmove', function(e) {
            // Allow pinch zoom but prevent other touch actions
            if (e.scale && e.scale !== 1) {
                // Allow pinch zoom
                return;
            }
        }, { passive: true });
        
        // Disable text selection
        document.addEventListener('selectstart', function(e) {
            e.preventDefault();
        });
        
        // Disable context menu
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
